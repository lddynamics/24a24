name: CI
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent24_owner
          POSTGRES_PASSWORD: owner_pw
          POSTGRES_DB: agent24_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent24_owner -d agent24_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Créer le rôle applicatif (comme docker/initdb/01-roles.sql)
        run: psql "postgresql://agent24_owner:owner_pw@localhost:5432/agent24_test" -c "CREATE ROLE agent24_app LOGIN PASSWORD 'app_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;"
      - run: pytest -q --ignore=tests/test_whatsapp.py   # ce fichier teste l’ancien WhatsAppSender (remplacé par EvolutionSender)
