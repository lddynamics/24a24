<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion · Armistice AI</title><style>{% include "_style.css" %}</style></head>
<body class="login"><form class="box" method="post" action="/console/login">
  <div class="brand">{% include "_logo.svg" %} Armistice AI</div>
  <h1 style="font-size:20px;margin-bottom:4px">Console de l'entreprise</h1>
  <p class="sub" style="margin:0 0 18px">Suivez votre employé IA, reprenez la main, gérez votre catalogue.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  <button class="btn" style="width:100%;justify-content:center;margin-top:16px" type="submit">Se connecter</button>
</form></body></html>
